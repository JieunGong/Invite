<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홈파티 초대 및 투표</title>
  <style>
    :root {
      --bg-pink: #ffe6ea;
      --bg-yellow: #fff3bf;
      --accent-red: #ff3366;
      --accent-red-hover: #e02855;
      --text-black: #222222;
      --card-bg: rgba(255, 255, 255, 0.92);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
      font-weight: 700;
      color: var(--text-black);
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg-pink) 0%, var(--bg-yellow) 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 12px 32px rgba(255, 51, 102, 0.15);
      border: 3px solid #ffffff;
    }

    .step {
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }

    .step.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 12px;
      color: var(--accent-red);
    }

    p.subtitle {
      text-align: center;
      font-size: 15px;
      margin-bottom: 24px;
      word-break: keep-all;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 16px;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="password"],
    textarea {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #ffd1dc;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      outline: none;
      background-color: #fff;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    textarea:focus {
      border-color: var(--accent-red);
    }

    textarea {
      height: 100px;
      resize: vertical;
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      background: #ffffff;
      border: 2px solid #ffe0e6;
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s, border-color 0.2s;
    }

    .checkbox-label:hover {
      border-color: var(--accent-red);
    }

    .checkbox-label input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--accent-red);
      margin-right: 12px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      background-color: var(--accent-red);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 12px rgba(255, 51, 102, 0.3);
    }

    .btn:hover {
      background-color: var(--accent-red-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background-color: #666;
      box-shadow: none;
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background-color: #444;
    }

    .error-msg {
      color: var(--accent-red);
      font-size: 14px;
      margin-top: 6px;
      display: none;
    }

    /* 결과 화면 스타일 */
    .summary-card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      border: 2px solid #ffe0e6;
    }

    .summary-title {
      font-size: 18px;
      color: var(--accent-red);
      margin-bottom: 12px;
      border-bottom: 2px solid #ffe0e6;
      padding-bottom: 6px;
    }

    .date-stat {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
    }

    .response-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 250px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .response-item {
      background: #fff9fa;
      border: 1px solid #ffd1dc;
      padding: 12px;
      border-radius: 10px;
    }

    .response-name {
      font-weight: 800;
      color: var(--accent-red);
      margin-bottom: 4px;
    }

    .response-dates {
      font-size: 14px;
      margin-bottom: 4px;
    }

    .response-req {
      font-size: 13px;
      color: #555;
      background: #fff;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px dashed #ccc;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Step 1: 이름 입력 -->
    <div id="step-1" class="step active">
      <h1>🎉 홈파티 초대장</h1>
      <p class="subtitle">반가워! 참석 여부 조사를 위해<br>이름을 입력해줘.</p>
      <div class="input-group">
        <label for="user-name">이름</label>
        <input type="text" id="user-name" placeholder="이름을 입력하세요">
        <div id="name-error" class="error-msg">이름을 입력해주세요!</div>
      </div>
      <button class="btn" onclick="goToStep2()">다음으로</button>
    </div>

    <!-- Step 2: 투표 및 요청사항 -->
    <div id="step-2" class="step">
      <h1>🗓️ 날짜 선택 및 요청</h1>
      <p class="subtitle"><span id="display-name" style="color:var(--accent-red);"></span>(아), 가능한 날짜를 모두 골라줘!</p>
      
      <div class="checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" name="party-date" value="12월 13일"> 12월 13일 (금)
        </label>
        <label class="checkbox-label">
          <input type="checkbox" name="party-date" value="12월 19일"> 12월 19일 (목)
        </label>
        <label class="checkbox-label">
          <input type="checkbox" name="party-date" value="12월 20일"> 12월 20일 (금)
        </label>
      </div>

      <div class="input-group">
        <label for="user-request">요청사항 (먹고 싶은 메뉴 등)</label>
        <textarea id="user-request" placeholder="자유롭게 적어줘!"></textarea>
      </div>

      <button class="btn" onclick="submitSurvey()">제출하기</button>
    </div>

    <!-- Step 3: 제출 완료 & 인증 요청 -->
    <div id="step-3" class="step">
      <h1>✅ 제출 완료!</h1>
      <p class="subtitle">설문 조사에 응답해줘서 고마워.<br>결과를 확인하려면 아래 버튼을 눌러줘.</p>
      
      <div id="auth-box" style="display: none; margin-bottom: 20px;">
        <div class="input-group">
          <label for="admin-pw">비밀번호 입력</label>
          <input type="password" id="admin-pw" placeholder="비밀번호 6자리">
          <div id="pw-error" class="error-msg">비밀번호가 올바르지 않습니다.</div>
        </div>
        <button class="btn" onclick="checkPassword()">확인</button>
      </div>

      <button id="show-auth-btn" class="btn" onclick="showAuthBox()">전체 결과 확인하기</button>
    </div>

    <!-- Step 4: 전체 결과 화면 -->
    <div id="step-4" class="step">
      <h1>📊 전체 투표 결과</h1>
      
      <div class="summary-card">
        <div class="summary-title">날짜별득표 현황</div>
        <div class="date-stat">
          <span>12월 13일 (금):</span>
          <span id="count-13">0명</span>
        </div>
        <div class="date-stat">
          <span>12월 19일 (목):</span>
          <span id="count-19">0명</span>
        </div>
        <div class="date-stat">
          <span>12월 20일 (금):</span>
          <span id="count-20">0명</span>
        </div>
      </div>

      <div class="summary-title">응답 목록</div>
      <div id="response-container" class="response-list">
        <!-- 동적 삽입 -->
      </div>

      <button class="btn btn-secondary" onclick="restart()">처음으로 돌아가기</button>
    </div>
  </div>

  <script>
    let currentName = '';

    function goToStep2() {
      const nameInput = document.getElementById('user-name').value.trim();
      const nameError = document.getElementById('name-error');

      if (!nameInput) {
        nameError.style.display = 'block';
        return;
      }
      nameError.style.display = 'none';
      currentName = nameInput;
      document.getElementById('display-name').textContent = currentName;

      document.getElementById('step-1').classList.remove('active');
      document.getElementById('step-2').classList.add('active');
    }

    function submitSurvey() {
      const selectedDates = Array.from(document.querySelectorAll('input[name="party-date"]:checked')).map(cb => cb.value);
      const requestText = document.getElementById('user-request').value.trim();

      const newResponse = {
        name: currentName,
        dates: selectedDates,
        request: requestText,
        timestamp: new Date().toLocaleString()
      };

      let responses = JSON.parse(localStorage.getItem('homeparty_responses') || '[]');
      responses.push(newResponse);
      localStorage.setItem('homeparty_responses', JSON.stringify(responses));

      document.getElementById('step-2').classList.remove('active');
      document.getElementById('step-3').classList.add('active');
    }

    function showAuthBox() {
      document.getElementById('show-auth-btn').style.display = 'none';
      document.getElementById('auth-box').style.display = 'block';
    }

    function checkPassword() {
      const pwInput = document.getElementById('admin-pw').value;
      const pwError = document.getElementById('pw-error');

      if (pwInput === '961216') {
        pwError.style.display = 'none';
        renderResults();
        document.getElementById('step-3').classList.remove('active');
        document.getElementById('step-4').classList.add('active');
      } else {
        pwError.style.display = 'block';
      }
    }

    function renderResults() {
      const responses = JSON.parse(localStorage.getItem('homeparty_responses') || '[]');
      
      let count13 = 0;
      let count19 = 0;
      let count20 = 0;

      const listContainer = document.getElementById('response-container');
      listContainer.innerHTML = '';

      if (responses.length === 0) {
        listContainer.innerHTML = '<p style="text-align:center; font-size:14px; color:#777;">아직 응답이 없습니다.</p>';
      }

      responses.forEach(res => {
        if (res.dates.includes('12월 13일')) count13++;
        if (res.dates.includes('12월 19일')) count19++;
        if (res.dates.includes('12월 20일')) count20++;

        const item = document.createElement('div');
        item.className = 'response-item';
        
        const datesText = res.dates.length > 0 ? res.dates.join(', ') : '선택 날짜 없음';
        const reqText = res.request ? res.request : '없음';

        item.innerHTML = `
          <div class="response-name">${res.name}</div>
          <div class="response-dates">🗓️ ${datesText}</div>
          <div class="response-req">💬 요청사항: ${reqText}</div>
        `;
        listContainer.appendChild(item);
      });

      document.getElementById('count-13').textContent = `${count13}명`;
      document.getElementById('count-19').textContent = `${count19}명`;
      document.getElementById('count-20').textContent = `${count20}명`;
    }

    function restart() {
      document.getElementById('user-name').value = '';
      document.getElementById('user-request').value = '';
      document.getElementById('admin-pw').value = '';
      document.querySelectorAll('input[name="party-date"]').forEach(cb => cb.checked = false);

      document.getElementById('auth-box').style.display = 'none';
      document.getElementById('show-auth-btn').style.display = 'block';

      document.getElementById('step-4').classList.remove('active');
      document.getElementById('step-1').classList.add('active');
    }
  </script>
</body>
</html>
